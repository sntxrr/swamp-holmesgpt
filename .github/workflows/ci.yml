name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extensions/models
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.x

      - name: fmt
        run: deno fmt --check holmesgpt.ts holmesgpt_test.ts

      - name: lint
        run: deno lint holmesgpt.ts holmesgpt_test.ts

      - name: check
        run: deno check holmesgpt.ts holmesgpt_test.ts

      - name: test
        run: deno test holmesgpt_test.ts
